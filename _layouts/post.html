---
layout: default
---

<article class="post-article">
  <header class="post-header">
    <h1 class="post-title"{% if page.i18n_key %} data-i18n="{{ page.i18n_key }}.title"{% endif %}>{{ page.title }}</h1>
    <div class="post-meta">
      <time class="post-date" datetime="{% if page.date_precision == 'month' %}{{ page.date | date: '%Y-%m' }}{% else %}{{ page.date | date_to_xmlschema }}{% endif %}">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16">
          <path fill="currentColor" d="M19,4H18V2H16V4H8V2H6V4H5C3.89,4 3,4.9 3,6V20A2,2 0 0,0 5,22H19A2,2 0 0,0 21,20V6A2,2 0 0,0 19,4M19,20H5V10H19V20M19,8H5V6H19V8Z" />
        </svg>
        <span data-i18n-date="{{ page.date | date: '%Y-%m-%d' }}" data-date-precision="{{ page.date_precision | default: 'day' }}">{% if page.date_precision == "month" %}
        {{ page.date | date: "%B %Y" }}
        {% else %}
        {{ page.date | date: "%B %d, %Y" }}
        {% endif %}</span>
      </time>
      {% if page.tags %}
      <div class="post-tags">
        <svg class="icon" viewBox="0 0 24 24" width="16" height="16">
          <path fill="currentColor" d="M5.5,7A1.5,1.5 0 0,1 4,5.5A1.5,1.5 0 0,1 5.5,4A1.5,1.5 0 0,1 7,5.5A1.5,1.5 0 0,1 5.5,7M21.41,11.58L12.41,2.58C12.05,2.22 11.55,2 11,2H4C2.89,2 2,2.89 2,4V11C2,11.55 2.22,12.05 2.59,12.41L11.58,21.41C11.95,21.77 12.45,22 13,22C13.55,22 14.05,21.77 14.41,21.41L21.41,14.41C21.78,14.05 22,13.55 22,13C22,12.45 21.77,11.95 21.41,11.58Z" />
        </svg>
        {% for tag in page.tags %}
          <a href="/blog/#{{ tag }}" class="post-tag">#<span data-i18n="tags.{{ tag }}">{{ tag }}</span></a>
        {% endfor %}
      </div>
      {% endif %}
    </div>
  </header>

  <div class="post-content"{% if page.i18n_key %} data-i18n="{{ page.i18n_key }}.body" data-i18n-html{% endif %}>
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="/blog/" class="back-to-blog">
      <svg class="icon" viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" />
      </svg>
      <span data-i18n="blog.back">Back to Blog</span>
    </a>
  </footer>
</article>

<style>
.page {
  float: none !important;
  width: 100% !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
}

.page__inner-wrap {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 1.5em;
}

.post-article {
  background: white;
  padding: 2em 0;
}

.post-header {
  margin-bottom: 2em;
  padding-bottom: 1.5em;
  border-bottom: 2px solid #e0e0e0;
}

.post-title {
  font-size: 2.2em;
  font-weight: 600;
  color: #2c3e50;
  line-height: 1.3;
  margin: 0 0 0.5em 0;
  border: none;
  padding: 0;
}

.post-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 1.5em;
  align-items: center;
  font-size: 0.95em;
  color: #7a8288;
}

.post-date,
.post-tags {
  display: flex;
  align-items: center;
  gap: 0.5em;
}

.icon {
  flex-shrink: 0;
  opacity: 0.7;
}

.post-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5em;
}

.post-tag {
  display: inline-block;
  padding: 0.3em 0.8em;
  background-color: #e8eaf6;
  color: #224b8d;
  border-radius: 15px;
  font-size: 0.9em;
  font-weight: 500;
  text-decoration: none;
  transition: all 0.2s ease;
}

.post-tag:hover {
  background-color: #224b8d;
  color: white;
  text-decoration: none;
  transform: translateY(-2px);
}

.post-content {
  font-size: 1.05em;
  line-height: 1.8;
  color: #2c3e50;
  margin-bottom: 3em;
}

.post-content h1,
.post-content h2,
.post-content h3 {
  margin-top: 1.5em;
  margin-bottom: 0.8em;
  font-weight: 600;
  color: #2c3e50;
}

.post-content h1 {
  font-size: 1.8em;
  border-bottom: 2px solid #e0e0e0;
  padding-bottom: 0.3em;
}

.post-content h2 {
  font-size: 1.5em;
  border-bottom: 1px solid #e8e8e8;
  padding-bottom: 0.3em;
}

.post-content p {
  margin-bottom: 1.2em;
}

.post-content a {
  color: #224b8d;
  text-decoration: underline;
}

.post-footer {
  margin-top: 3em;
  padding-top: 2em;
  border-top: 2px solid #e0e0e0;
}

.back-to-blog {
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  padding: 0.8em 1.5em;
  background-color: #f8f9fa;
  color: #224b8d;
  border: 1px solid #224b8d;
  border-radius: 25px;
  text-decoration: none;
  font-weight: 500;
  transition: all 0.2s ease;
}

.back-to-blog:hover {
  background-color: #224b8d;
  color: white;
  text-decoration: none;
  transform: translateX(-5px);
}

@media (max-width: 768px) {
  .post-title {
    font-size: 1.8em;
  }
  .post-content {
    font-size: 1em;
  }
}
</style>
