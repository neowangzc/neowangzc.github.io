  papers.cognition.status: "<em>SSM – Population Health</em>の特集号「Social Determinants of Cognitive Inequality Across the Life Course」に投稿し、現在査読中です。"
  papers.frailty.status: "<em>Innovation in Aging</em>に投稿済み。"
  papers.occupational_persistence.status: "<em>Work, Employment and Society</em>に投稿済み。"
  awards.jsps: "<a href=\"https://www.jsps.go.jp/j-pd/pd_gaiyo.html\">日本学術振興会特別研究員（DC2）</a>、日本学術振興会。"
  awards.wise: "研究助成、<a href=\"https://www.aie.tohoku.ac.jp/english/\">AIエレクトロニクスWISEプログラム</a>。"
  awards.masters: "北京交通大学優秀修士論文賞"
  awards.doctoral: "第8回Sino-EU Doctoral School博士学生フォーラム 最優秀発表賞"
  activities.sicss: "計算社会科学サマースクール（SICSS-Hong Kong）"
  projects.research: "研究プロジェクト"
  projects.tools: "研究ツール"
  projects.norms.title: "大規模言語モデルにおける規範形成"
  projects.norms.body: "Zeyu Lyu教授と協力し、活性化ステアリングを用いて、社会規範がLLMおよびLLMマルチエージェントシステムでどのように形成・安定化するかを研究しています。"
  projects.platform.title: "汎用LLMベース社会実験プラットフォーム"
  projects.platform.body: "浙江大学のChao Wu教授のグループによるオープンソースの生成エージェントシミュレーションプラットフォームに貢献し、シミュレーションシナリオと相互作用ロジックを設計・実装しました。"
  projects.newschat.body: "Hiroki Takikawa教授のグループ向けにニュース閲覧プラットフォームを設計・開発しました。LLMを介したニュース消費に対するユーザーの関与、信頼、行動反応を実験的に調べるためのものです。"
  projects.deadlines.body: "社会科学分野の主要な学会、ワークショップ、サマースクールの締切を一覧化し、分野（社会学、政治学、経済学、計算社会科学など）による絞り込み、参加費・助成情報、カレンダーへのワンクリック追加機能を提供します。<a href=\"https://github.com/huggingface/ai-deadlines\">huggingface/ai-deadlines</a>を基にしています。"
  projects.papergrab.body: "英語・中国語の社会科学系学術誌の最新論文をワンクリックで取得します。英語誌はCrossRef API、中国語誌は国家哲学社会科学文献センター（NCPSSD）を利用します。雑誌を選択して論文を取得し、CSVをダウンロードできます。"
