  profile.bio: "東北大学博士課程学生。"
  profile.location: "日本・仙台"
  profile.email: "メール"
  about.intro: "東北大学大学院文学研究科の博士課程に在籍し、<a href=\"https://lvzeyu.github.io/\">Zeyu Lyu教授</a>の指導のもとで研究しています。また、シンガポール国立大学の<a href=\"https://discovery.nus.edu.sg/19615-senhu-wang\">Senhu Wang教授</a>からも研究指導を受けています。"
  about.education: "研究室に加わる前は、北京交通大学でコンピュータサイエンスの修士号を、電子科技大学（UESTC）で電子工学の学士号を取得しました。"
  about.research: "計算社会科学を専門としています。計算手法、大規模なデジタルトレースデータ、LLMに基づく社会シミュレーションを用いて、社会的不平等と、個人の行動や相互作用が集合的な結果を生み出す過程を研究しています。最近は、オンライン労働市場、意見ダイナミクス、文化市場、学術キャリアにおけるジェンダー不平等に取り組んでいます。"
