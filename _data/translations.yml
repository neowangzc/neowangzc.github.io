  about.intro: "我目前是东北大学大学院文学研究科博士生，师从 <a href=\"https://lvzeyu.github.io/\">Zeyu Lyu 教授</a>。我同时接受新加坡国立大学 <a href=\"https://discovery.nus.edu.sg/19615-senhu-wang\">Senhu Wang 教授</a>的研究指导。"
  about.education: "加入实验室之前，我获得了北京交通大学计算机科学硕士学位，以及电子科技大学（UESTC）电子工程学士学位。"
  about.research: "我的研究领域是计算社会科学。我运用计算方法、大规模数字踪迹数据和基于大语言模型（LLM）的社会模拟，研究社会不平等，以及个体行为与互动如何形成集体结果。近期研究聚焦于在线劳动力市场、意见动态、文化市场和学术职业中的性别不平等。"
