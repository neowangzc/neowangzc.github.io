  projects.norms.title: "大语言模型中的规范形成"
  projects.norms.body: "与 Zeyu Lyu 教授合作，运用激活引导研究社会规范如何在大语言模型（LLM）及多智能体系统中形成并稳定下来。"
  projects.platform.title: "通用大语言模型社会实验平台"
  projects.platform.body: "参与浙江大学 Chao Wu 教授团队的开源生成式智能体模拟平台开发，设计并实现模拟场景与互动逻辑。"
  projects.newschat.body: "为 Hiroki Takikawa 教授团队设计并开发新闻阅读平台，用于研究 LLM 介入新闻阅读时的用户参与、信任与行为反应。"
  projects.deadlines.body: "汇总社会科学主要会议、研讨会和暑期学校的截止日期，并提供学科筛选（社会学、政治学、经济学、计算社会科学等）、费用与资助信息，以及一键添加到日历功能。改编自 <a href=\"https://github.com/huggingface/ai-deadlines\">huggingface/ai-deadlines</a>。"
  projects.papergrab.body: "一键获取中英文社会科学期刊的最新文章。英文期刊数据来自CrossRef API，中文期刊数据来自国家哲学社会科学文献中心（NCPSSD）。可选择期刊、获取文章并下载CSV。"
