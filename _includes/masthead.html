<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button type="button" aria-label="Navigation menu" data-i18n-aria-label="nav.menu">
          <div class="navicon" aria-hidden="true"></div>
        </button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a
              href="/#about-me" data-i18n="nav.home">Homepage</a></li>
          {% for link in site.data.navigation.main %}
          <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}" data-i18n="{{ link.i18n }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    <nav class="language-switcher" aria-label="Language" data-i18n-aria-label="language.label" hidden>
      <button type="button" data-language="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
      <button type="button" data-language="zh" lang="zh-Hans" aria-label="简体中文" aria-pressed="false">中文</button>
      <button type="button" data-language="ja" lang="ja" aria-label="日本語" aria-pressed="false">日本語</button>
    </nav>
  </div>
</div>
